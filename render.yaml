# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates the Django backend as a Docker web service. That's it — no
# database, no Key Value — both live outside Render:
#   - DATABASE_URL: Supabase Postgres (free tier pauses after 7 days of
#     inactivity but never deletes data; Render's own free Postgres is
#     hard-deleted 30+14 days after creation).
#   - REDIS_URL: Upstash Redis (free tier: 256MB, 500K commands/month, no
#     card required, no documented inactivity expiry — unlike Render's own
#     free Key Value, which additionally has zero disk persistence and can
#     be restarted/wiped for maintenance at any time).
# See docs/backend-specifications.md §0 for the full reasoning.
#
# A few values must be set by hand in the Render dashboard after the first
# deploy (marked `sync: false` below) since they're secrets or depend on
# infrastructure this file doesn't own:
#   - DATABASE_URL               (Supabase connection string, "Connection pooling" mode)
#   - REDIS_URL                  (Upstash connection string, rediss:// with TLS)
#   - CORS_ALLOWED_ORIGINS       (the frontend's deployed URL)
#   - FIREBASE_SERVICE_ACCOUNT_JSON
#   - FACEBOOK_PAGE_ID            (blank until Facebook publishing is set up, see marketing/publishing.py)
#   - FACEBOOK_PAGE_ACCESS_TOKEN  (idem — long-lived Page token, not a User token)

services:
  - name: sokens-backend
    type: web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
